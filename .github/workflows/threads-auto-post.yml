name: Threads Auto Post

on:
  schedule:
    # Check four times per hour. The script posts only once in each due slot.
    - cron: "7,22,37,52 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず原稿だけ確認する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish next post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python post_threads.py --dry-run
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            python post_threads.py --scheduled
          else
            python post_threads.py
          fi

      - name: Save queue position
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Advance Threads post queue"
          git push
