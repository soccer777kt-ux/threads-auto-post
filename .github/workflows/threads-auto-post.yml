name: Threads Auto Post

on:
  schedule:
    # GitHub ActionsのcronはUTC。日本時間で曜日ごとに朝・昼・夜の3回を直接起動します。
    # 月曜 07:23 / 12:37 / 20:19
    - cron: "23 22 * * 0"
    - cron: "37 3 * * 1"
    - cron: "19 11 * * 1"
    # 火曜 08:11 / 11:53 / 21:07
    - cron: "11 23 * * 1"
    - cron: "53 2 * * 2"
    - cron: "7 12 * * 2"
    # 水曜 07:41 / 12:16 / 19:43
    - cron: "41 22 * * 2"
    - cron: "16 3 * * 3"
    - cron: "43 10 * * 3"
    # 木曜 08:27 / 13:04 / 20:51
    - cron: "27 23 * * 3"
    - cron: "4 4 * * 4"
    - cron: "51 11 * * 4"
    # 金曜 07:08 / 12:49 / 21:23
    - cron: "8 22 * * 4"
    - cron: "49 3 * * 5"
    - cron: "23 12 * * 5"
    # 土曜 08:44 / 11:38 / 19:18
    - cron: "44 23 * * 5"
    - cron: "38 2 * * 6"
    - cron: "18 10 * * 6"
    # 日曜 07:56 / 13:17 / 20:36
    - cron: "56 22 * * 6"
    - cron: "17 4 * * 0"
    - cron: "36 11 * * 0"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず原稿だけ確認する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preview next post
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: python post_threads.py --dry-run

      - name: Publish scheduled post
        if: github.event_name == 'schedule'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py --scheduled

      - name: Publish post now
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py

      - name: Save queue position
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Advance Threads post queue"
          git push
